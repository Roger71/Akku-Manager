<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roger’s Akku Manager</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Akku Manager">
    <meta name="theme-color" content="#f2f2f7">

    <!-- Standard Favicon -->
    <link rel="icon" type="image/svg+xml" id="favicon">
    <link rel="apple-touch-icon" id="appleTouchIcon">

    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --primary: #0066ff;
            --primary-light: #e8f0fe;
            --primary-dark: #0052cc;
            --danger: #ff3b30;
            --danger-light: #ffe5e5;
            --text-dark: #1c1c1e;
            --text-muted: #8e8e93;
            --border-color: rgba(60, 60, 67, 0.12);
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 16px 12px calc(40px + env(safe-area-inset-bottom)) 12px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER SECTION */
        header {
            text-align: center;
            margin: 12px 0 20px 0;
        }

        .header-icon-box {
            width: 68px;
            height: 68px;
            margin: 0 auto 10px auto;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1c1d22 0%, #0d0e12 100%);
        }

        .header-icon-box svg {
            width: 58px;
            height: 58px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            color: var(--text-dark);
        }

        header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            font-weight: 500;
        }

        /* CARDS */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }

        /* FORM STYLES */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-left: 2px;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 500;
            background-color: #f9f9fb;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E8E93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 12px top 50%;
            background-size: 10px auto;
            padding-right: 30px;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
        }

        /* MANUFACTURER CHIPS */
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-chip {
            background: #eef0f5;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #4a4a4f;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-chip:active {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        /* BUTTONS */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button.btn-add {
            flex: 1;
            background: linear-gradient(180deg, #0071e3 0%, #005bb5 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        button.btn-add:active {
            transform: scale(0.98);
            filter: brightness(0.9);
        }

        button.btn-cancel {
            background: #e5e5ea;
            color: var(--text-dark);
            border: none;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* SECTION LIST HEADERS */
        .section-header {
            font-size: 16px;
            font-weight: 800;
            margin: 24px 0 10px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            letter-spacing: -0.3px;
        }

        .section-badge {
            background: #e2e8f0;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }

        /* BATTERY ITEM TABLE */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .battery-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s ease;
        }

        .battery-item:last-child {
            border-bottom: none;
        }

        .battery-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .akku-title {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* TYPE BADGES */
        .type-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-lipo { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
        .type-lihv { background: #faf5ff; color: #7e22ce; border: 1px solid #f3e8ff; }
        .type-life { background: #f0fdf4; color: #15803d; border: 1px solid #dcfce7; }
        .type-liion { background: #ecfeff; color: #0e7490; border: 1px solid #cff4fc; }

        .manufacturer-tag {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        .cap-tag {
            color: var(--primary);
            font-weight: 800;
            font-size: 17px;
            letter-spacing: -0.3px;
        }

        .battery-data-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-muted);
        }

        .data-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #475569;
        }

        .data-badge strong {
            font-weight: 700;
            color: var(--text-dark);
        }

        /* ACTIONS */
        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        .btn-action:active {
            transform: scale(0.9);
        }

        .btn-edit { background: var(--primary-light); color: var(--primary); }
        .btn-del { background: var(--danger-light); color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px stroke var(--border-color);
        }

        /* BACKUP FOOTER BAR */
        .backup-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .backup-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .backup-actions {
            display: flex;
            gap: 8px;
        }

        .btn-secondary-sm {
            background: #eef0f5;
            color: var(--text-dark);
            border: none;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-secondary-sm:active {
            background: #d1d5db;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-icon-box" id="headerIcon"></div>
        <h1>Roger’s Akku Manager</h1>
        <p>Akkus einfach & präzise verwalten</p>
    </header>

    <div class="card" id="formCard">
        <h3 class="card-title" id="formTitle">➕ Neuen Akku hinzufügen</h3>
        <form id="lipoForm">
            <div class="grid-form">
                <div class="form-group full-width">
                    <label>Hersteller (Optional)</label>
                    <input type="text" id="manufacturer" placeholder="Name eingeben oder wählen">
                    <div class="quick-buttons">
                        <button type="button" class="btn-chip" onclick="setManufacturer('Tattu')">Tattu</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('CNHL')">CNHL</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('SLS')">SLS</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Wellpower')">Wellpower</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Turnigy')">Turnigy</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Hacker')">Hacker</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Ovonic')">Ovonic</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Gens ace')">Gens ace</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('Spektrum')">Spektrum</button>
                        <button type="button" class="btn-chip" onclick="setManufacturer('GNB')">GNB</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Akku Typ</label>
                    <select id="type">
                        <option value="LiPo" selected>LiPo</option>
                        <option value="LiHV">LiHV</option>
                        <option value="LiFe">LiFe</option>
                        <option value="LiIon">LiIon</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Kapazität (mAh)</label>
                    <input type="number" id="capacity" placeholder="z. B. 1500" min="50" max="50000" required>
                </div>

                <div class="form-group">
                    <label>Zellenzahl (S)</label>
                    <input type="number" id="cellCount" placeholder="z. B. 4" min="1" max="14" required>
                </div>

                <div class="form-group">
                    <label>Gewicht (g)</label>
                    <input type="number" id="weight" placeholder="z. B. 180" step="0.1" required>
                </div>

                <div class="form-group">
                    <label>Laderate (C)</label>
                    <input type="number" id="chargeRate" placeholder="z. B. 1.0" step="0.1" required>
                </div>

                <div class="form-group">
                    <label>Entladerate (C)</label>
                    <input type="text" id="dischargeRate" placeholder="z. B. 75 oder 30/70" required>
                </div>

                <div class="form-group full-width">
                    <label>Kaufdatum (Optional)</label>
                    <input type="date" id="purchaseDate">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" id="cancelBtn" style="display:none;" onclick="cancelEdit()">Abbrechen</button>
                <button type="submit" class="btn-add" id="submitBtn">Akku Speichern</button>
            </div>
        </form>
    </div>

    <div id="batteryList"></div>

    <div class="backup-bar">
        <span class="backup-title">💾 Datensicherung</span>
        <div class="backup-actions">
            <button class="btn-secondary-sm" onclick="exportData()">📥 Export</button>
            <button class="btn-secondary-sm" onclick="document.getElementById('importFile').click()">📤 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <script>
        // --- 1. ICON GENERATOR (Dynamic SVG Home Screen Icon) ---
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1c1d22"/>
                    <stop offset="100%" stop-color="#0c0d10"/>
                </linearGradient>
                <linearGradient id="bat" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#fbbf24"/>
                    <stop offset="100%" stop-color="#d97706"/>
                </linearGradient>
                <linearGradient id="xt" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#f59e0b"/>
                    <stop offset="100%" stop-color="#b45309"/>
                </linearGradient>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
                </filter>
            </defs>
            <rect width="512" height="512" rx="115" fill="url(#bg)"/>
            <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
            <g filter="url(#shadow)">
                <path d="M 230 135 Q 220 85 285 75" stroke="#ef4444" stroke-width="18" fill="none" stroke-linecap="round"/>
                <path d="M 195 135 Q 185 65 245 55" stroke="#374151" stroke-width="18" fill="none" stroke-linecap="round"/>
                <rect x="265" y="50" width="55" height="38" rx="8" fill="url(#xt)" transform="rotate(-12 290 70)"/>
                <rect x="105" y="135" width="302" height="290" rx="28" fill="url(#bat)"/>
                <rect x="105" y="135" width="302" height="58" rx="28" fill="#18181b"/>
                <rect x="105" y="165" width="302" height="28" fill="#18181b"/>
                <rect x="125" y="210" width="262" height="190" rx="18" fill="#09090b" opacity="0.92"/>
                <path d="M 265 230 L 225 305 L 265 305 L 245 380 L 295 295 L 255 295 Z" fill="#fbbf24"/>
                <text x="256" y="340" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="4">LIPO PACK</text>
            </g>
        </svg>`;

        // Render Icon into Header
        document.getElementById('headerIcon').innerHTML = svgIcon;

        // Generate PNG Touch Icon for iOS Homescreen
        (function setupIcons() {
            const svgBlob = new Blob([svgIcon], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const pngData = canvas.toDataURL('image/png');
                document.getElementById('appleTouchIcon').href = pngData;
                document.getElementById('favicon').href = pngData;
                URL.revokeObjectURL(url);
            };
            img.src = url;
        })();

        // --- 2. APP LOGIC ---
        let batteries = [];
        try {
            batteries = JSON.parse(localStorage.getItem('lipo_batteries_db')) || [];
        } catch (e) {
            console.log('LocalStorage nicht zugänglich');
        }

        let editingId = null;

        function setManufacturer(name) {
            document.getElementById('manufacturer').value = name;
        }

        function formatDischarge(val) {
            if (!val) return '-';
            let str = String(val).trim();
            if (!str.toLowerCase().endsWith('c')) {
                str += 'C';
            }
            return str;
        }

        document.getElementById('lipoForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const batteryData = {
                manufacturer: document.getElementById('manufacturer').value.trim() || "-",
                type: document.getElementById('type').value,
                capacity: parseInt(document.getElementById('capacity').value),
                cellCount: parseInt(document.getElementById('cellCount').value),
                chargeRate: parseFloat(document.getElementById('chargeRate').value),
                dischargeRate: document.getElementById('dischargeRate').value.trim(),
                weight: parseFloat(document.getElementById('weight').value),
                purchaseDate: document.getElementById('purchaseDate').value || ""
            };

            if (editingId !== null) {
                const index = batteries.findIndex(b => b.id === editingId);
                if (index !== -1) {
                    batteries[index] = { id: editingId, ...batteryData };
                }
            } else {
                batteries.push({ id: Date.now(), ...batteryData });
            }

            saveAndRender();
            cancelEdit();
        });

        function editBattery(id) {
            const b = batteries.find(item => item.id === id);
            if (!b) return;

            editingId = id;
            document.getElementById('manufacturer').value = b.manufacturer === '-' ? '' : b.manufacturer;
            document.getElementById('type').value = b.type;
            document.getElementById('capacity').value = b.capacity;
            document.getElementById('cellCount').value = b.cellCount;
            document.getElementById('weight').value = b.weight;
            document.getElementById('chargeRate').value = b.chargeRate;
            document.getElementById('dischargeRate').value = b.dischargeRate || '';
            document.getElementById('purchaseDate').value = b.purchaseDate;

            document.getElementById('formTitle').innerText = "✏️ Akku bearbeiten";
            document.getElementById('submitBtn').innerText = "Änderung Speichern";
            document.getElementById('cancelBtn').style.display = "block";

            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('lipoForm').reset();
            document.getElementById('type').value = "LiPo";
            document.getElementById('formTitle').innerText = "➕ Neuen Akku hinzufügen";
            document.getElementById('submitBtn').innerText = "Akku Speichern";
            document.getElementById('cancelBtn').style.display = "none";
        }

        function deleteBattery(id) {
            if (confirm("Möchtest du diesen Akku wirklich löschen?")) {
                batteries = batteries.filter(b => b.id !== id);
                if (editingId === id) cancelEdit();
                saveAndRender();
            }
        }

        function saveAndRender() {
            try {
                localStorage.setItem('lipo_batteries_db', JSON.stringify(batteries));
            } catch (e) {}
            render();
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'k. A.';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return dateStr;
        }

        function exportData() {
            if (!batteries || batteries.length === 0) {
                alert("Keine Akkus zum Exportieren vorhanden.");
                return;
            }

            const jsonStr = JSON.stringify(batteries, null, 2);
            const blob = new Blob([jsonStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = url;
            downloadAnchor.download = `rogers_akkus_backup_${new Date().toISOString().slice(0,10)}.json`;
            
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        batteries = imported;
                        saveAndRender();
                        alert("Backup erfolgreich geladen!");
                    } else {
                        alert("Ungültiges Dateiformat.");
                    }
                } catch (err) {
                    alert("Fehler beim Lesen der Datei.");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        function getTypeClass(type) {
            switch(type) {
                case 'LiHV': return 'type-lihv';
                case 'LiFe': return 'type-life';
                case 'LiIon': return 'type-liion';
                default: return 'type-lipo';
            }
        }

        function render() {
            const listDiv = document.getElementById('batteryList');
            listDiv.innerHTML = '';

            const grouped = {};
            batteries.forEach(b => {
                if (!grouped[b.cellCount]) grouped[b.cellCount] = [];
                grouped[b.cellCount].push(b);
            });

            const sortedCells = Object.keys(grouped).map(Number).sort((a, b) => a - b);

            if (sortedCells.length === 0) {
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 36px; margin-bottom: 8px;">🔋</div>
                        <p style="margin: 0; font-weight: 600; color: #1c1c1e;">Keine Akkus eingetragen</p>
                        <p style="margin: 4px 0 0 0; font-size: 13px;">Füge oben deinen ersten Akku hinzu.</p>
                    </div>
                `;
                return;
            }

            sortedCells.forEach(cell => {
                const section = document.createElement('div');
                section.className = 'section-header';
                section.innerHTML = `
                    <span>${cell}S Akkus</span>
                    <span class="section-badge">${grouped[cell].length} Akku${grouped[cell].length > 1 ? 's' : ''}</span>
                `;
                listDiv.appendChild(section);

                const container = document.createElement('div');
                container.className = 'table-container';

                container.innerHTML = grouped[cell].map(b => `
                    <div class="battery-item">
                        <div class="battery-main-row">
                            <div class="akku-title">
                                <span class="type-badge ${getTypeClass(b.type)}">${b.type}</span>
                                ${b.manufacturer && b.manufacturer !== '-' ? `<span class="manufacturer-tag">${b.manufacturer}</span>` : ''}
                                <span class="cap-tag">${b.capacity} mAh</span>
                            </div>
                            <div class="action-btns">
                                <button class="btn-action btn-edit" onclick="editBattery(${b.id})" title="Bearbeiten">✏️</button>
                                <button class="btn-action btn-del" onclick="deleteBattery(${b.id})" title="Löschen">✕</button>
                            </div>
                        </div>

                        <div class="battery-data-row">
                            <span class="data-badge">⚡ <strong>${b.chargeRate}C / ${formatDischarge(b.dischargeRate)}</strong></span>
                            <span class="data-badge">⚖️ <strong>${b.weight}g</strong></span>
                            <span class="data-badge">📅 <strong>${formatDate(b.purchaseDate)}</strong></span>
                        </div>
                    </div>
                `).join('');

                listDiv.appendChild(container);
            });
        }

        render();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
